<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#93c5fd;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.3" />
    </linearGradient>

    <!-- Filter for shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="url(#accentGradient)" opacity="0.2"/>
  <circle cx="1100" cy="530" r="200" fill="url(#accentGradient)" opacity="0.2"/>

  <!-- Icon container (left side) -->
  <g transform="translate(100, 180)">
    <!-- Shield background -->
    <path d="M 90 0 L 145 25 L 145 100 Q 145 150 90 175 Q 35 150 35 100 L 35 25 Z"
          fill="#ffffff" opacity="0.15" filter="url(#shadow)"/>

    <!-- Main shield -->
    <path d="M 90 12 L 137 35 L 137 100 Q 137 143 90 165 Q 43 143 43 100 L 43 35 Z"
          fill="#ffffff" stroke="none"/>

    <!-- Lock body -->
    <rect x="78" y="93" width="24" height="30" rx="2" fill="#1e40af"/>

    <!-- Lock shackle -->
    <path d="M 75 93 L 75 80 Q 75 68 90 68 Q 105 68 105 80 L 105 93"
          fill="none" stroke="#1e40af" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Keyhole -->
    <circle cx="90" cy="105" r="3" fill="#ffffff"/>
    <rect x="88" y="105" width="4" height="7" fill="#ffffff"/>

    <!-- Message bubble 1 (right) -->
    <g transform="translate(140, 30)">
      <rect x="0" y="0" width="60" height="40" rx="8" fill="#60a5fa" opacity="0.8"/>
      <path d="M 10 40 L 15 45 L 20 40" fill="#60a5fa" opacity="0.8"/>
      <line x1="10" y1="15" x2="50" y2="15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="25" x2="40" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Message bubble 2 (left) -->
    <g transform="translate(-40, 80)">
      <rect x="0" y="0" width="55" height="38" rx="8" fill="#93c5fd" opacity="0.8"/>
      <path d="M 45 38 L 50 43 L 55 38" fill="#93c5fd" opacity="0.8"/>
      <line x1="10" y1="14" x2="45" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="24" x2="35" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main title -->
  <text x="400" y="250" font-family="Arial, Helvetica, sans-serif" font-size="80"
        font-weight="bold" fill="#ffffff" filter="url(#shadow)">
    O'Chat
  </text>

  <!-- Subtitle -->
  <text x="400" y="320" font-family="Arial, Helvetica, sans-serif" font-size="36"
        fill="#ffffff" opacity="0.95">
    Secure Inter-Instance Communication
  </text>

  <!-- Feature badges -->
  <g transform="translate(400, 370)">
    <!-- Badge 1: E2E Encrypted -->
    <rect x="0" y="0" width="250" height="50" rx="25" fill="#ffffff" opacity="0.2"/>
    <text x="25" y="33" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff">
      🔒 E2E Encrypted
    </text>

    <!-- Badge 2: Real-Time -->
    <rect x="260" y="0" width="200" height="50" rx="25" fill="#ffffff" opacity="0.2"/>
    <text x="285" y="33" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff">
      ⚡ Real-Time
    </text>

    <!-- Badge 3: RSA-4096 -->
    <rect x="480" y="0" width="180" height="50" rx="25" fill="#ffffff" opacity="0.2"/>
    <text x="495" y="33" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff">
      🛡️ RSA-4096
    </text>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28"
        fill="#ffffff" opacity="0.85" font-style="italic">
    Connect your Odoo instances securely and instantly
  </text>

  <!-- Decorative connection lines -->
  <g opacity="0.3">
    <line x1="300" y1="250" x2="350" y2="280" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="300" y1="300" x2="350" y2="320" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="350" cy="280" r="4" fill="#ffffff"/>
    <circle cx="350" cy="320" r="4" fill="#ffffff"/>
  </g>
</svg>
